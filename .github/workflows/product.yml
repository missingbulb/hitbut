# hitbut's own build: the requirements suite that gates pull requests and `main`. The
# deploy that used to ship from here is now the `deploy` Claudinite task
# (.claudinite/local/packs/hitbut/tasks/deploy/) — the `wake-deploy` job below only files
# its work item once main is green; the executor runs it.
name: product

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: requirements (logic, behavior, server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Watch the count, not the colour: a run that finds no tests exits green.
      - run: npm test
      - run: npm run test:server
      # Phase 0's exit condition that needs no account: the committed wrangler.toml
      # builds and its bindings resolve.
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dry-run"

  screen:
    name: requirements (screen)
    runs-on: ubuntu-latest
    # Pinned to the Playwright the goldens were rendered with. A different build
    # rasterises text differently, and the comparison would measure the renderer.
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:screen
      - name: The pictures, when they disagree
        if: failure()
        # v6, not v5 like the actions above: upload-artifact's v5 still runs on
        # Node 20, so matching the others here would leave the deprecation in
        # place on the one step that only runs when something is already wrong.
        uses: actions/upload-artifact@v6
        with:
          name: screen-failures
          path: dev/requirements/failures/
          if-no-files-found: ignore

  wake-deploy:
    name: wake the deploy task
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [checks, screen]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Create the deploy task's work item
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .claudinite/shared/packs/claudinite-tasks/queue/create-work-item.mjs hitbut/deploy
