# Is production ready to be deployed to? Reads only — creates nothing, changes nothing,
# safe to run any number of times.
#
# Run it to see what production is still missing — everything it reports as missing is
# created by the *provision* workflow — and run it first when a deploy fails, because most
# deploy failures are a resource or a secret that is not there.
name: preflight

on:
  workflow_dispatch:

jobs:
  preflight:
    name: does production exist
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preflight
        run: npm run preflight
